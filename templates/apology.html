{% extends "layout.html" %}

{% block title %} · {{ t('apology.title') }}{% endblock %}

{% block main %}
<div class="apology">
    <div class="apology-mark" aria-hidden="true"></div>
    <h1 class="apology-title">{{ t('apology.title') }}</h1>
    {% if bottom %}
    <p class="apology-msg">{{ bottom }}</p>
    {% endif %}
    <a href="javascript:history.back()" class="btn btn-ghost">{{ t('apology.back') }}</a>
</div>
{% endblock %}
