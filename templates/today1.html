{% extends "layout.html" %}

{% block title %} · {{ t('nav.today') }}{% endblock %}

{% block main %}
<div class="page">
    <div class="empty-state">
        <div class="eyebrow">{{ t('today.empty_eyebrow') }}</div>
        <div class="display-num">00<span class="of">/</span><span class="total">21</span></div>
        <p class="lede" style="margin-top: 24px;">{{ t('today.empty_lede') }}</p>
        <p class="muted" style="max-width: 480px; margin: 0 auto 40px;">{{ t('today.empty_desc') }}</p>
        <a href="{{ url_for('set_habits') }}" class="btn btn-primary btn-large">{{ t('today.empty_btn') }}</a>
    </div>
</div>
{% endblock %}
